<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Memory à 4 joueurs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Memory Style</h1>

    <div id="accueil">

        <h2>Battle Memory Online</h2>

        <input
            type="text"
            id="pseudo"
            placeholder="Votre pseudo">

        <br><br>

        <button id="creerPartie">
            Créer une partie
        </button>

        <br><br>

        <input
            type="text"
            id="codePartie"
            placeholder="Code partie">

        <button id="rejoindrePartie">
            Rejoindre
        </button>

    </div>

    <div id="lobby" style="display:none;">

        <h2>Lobby</h2>

        <p>
            Code :
            <span id="codeLobby"></span>
        </p>

        <h3>Joueurs connectés</h3>

        <ul id="listeJoueurs"></ul>

        <button id="commencer">
            Commencer
        </button>

    </div>

    <div id="jeu" style="display:none;">

        <h2 id="tour" class="joueur1">
    🔴 Tour du joueur 1
</h2>

<h3 id="timer">
    ⏱️ 15
</h3>

<p id="scores">
    J1 : 0 | J2 : 0 | J3 : 0 | J4 : 0
</p><p id="etatCouleurs">
    🔵 Bleu : 3 | 🔴 Rouge : 3 | 🟡 Jaune : 3 | 🟢 Vert : 3
</p>

        <p id="score">
            Score : 0
        </p>

        <button id="nouvellePartie">
            Nouvelle partie
        </button>

        <div id="plateau"></div>

    </div>

    <div id="finPartie" style="display:none;">

        <h2>🏆 FIN DE PARTIE</h2>

        <p id="classement"></p>a

        <button id="rejouer">
            Nouvelle partie
        </button>

    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
