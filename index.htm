<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Memory à 4 joueurs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Memory Style</h1>

    <div id="jeu">

        <h2 id="tour" class="joueur1">🔴 Tour du joueur 1</h2>

        <p id="scores">J1 : 0 | J2 : 0 | J3 : 0 | J4 : 0</p>

        <p id="score">Score : 0</p>

        <button id="nouvellePartie">
            Nouvelle partie
        </button>

        <div id="plateau"></div>

    </div>

    <div id="finPartie">

        <h2>🏆 FIN DE PARTIE</h2>

        <p id="classement"></p>

        <button id="rejouer">
            Nouvelle partie
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
