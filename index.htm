<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>PlayBattle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Strip Memory Battle</h1>

    <div id="accueil">

        <h2>Battle Memory Online</h2>
        <p id="compteurParties">
    🎮 Games Played : 0
</p>

        <input
            type="text"
            id="pseudo"
            placeholder="Nickname">

        <br><br>

        <button id="creerPartie" class="boutonMenu">
    Create Game
</button>

        <br><br>

        <input
            type="text"
            id="codePartie"
            placeholder="Game Code">

        <button id="boutonRejoindre" class="boutonMenu">
    Join Game
</button>

    </div>

    <div id="lobby" style="display:none;">

        <h2>Lobby</h2>

        <p>
            Code :
            <span id="codeLobby"></span>
        </p>

        <h3>Players</h3>

        <ul id="listeJoueurs"></ul>

        <button id="commencer">
            Start Game
        </button>

    </div>

    <div id="jeu" style="display:none;">

        <h2 id="tour" class="joueur1">
    🔴 Turn player 1
</h2>

<h3 id="timer">
    ⏱️ 15
</h3>

<p id="scores">
    J1 : 0 | J2 : 0 | J3 : 0 | J4 : 0
</p><p id="etatCouleurs">
    🔵 Bleu : 3 | 🔴 Rouge : 3 | 🟡 Jaune : 3 | 🟢 Vert : 3
</p>

        <p id="score">
            Score : 0
        </p>

        <button id="nouvellePartie">
            New Game
        </button>

        <div id="plateau"></div>

    </div>

    <div id="finPartie" style="display:none;">

        <h2>🏆 Game Over</h2>

        <p id="classement"></p>a

        <button id="rejouer">
            New Game
        </button>

    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
